[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prio"
version = "0.0.1"
description = "Category-scoped review-priority map for GitHub pull requests"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
model = ["anthropic>=1.0"]
site = ["jinja2>=3.1"]

[project.scripts]
prio = "prio.cli:main"

[tool.setuptools.packages.find]
include = ["prio*"]
